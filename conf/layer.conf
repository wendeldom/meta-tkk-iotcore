# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-tkk-iotcore"
BBFILE_PATTERN_meta-tkk-iotcore = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-tkk-iotcore = "6"

LAYERDEPENDS_meta-tkk-iotcore = "core"
LAYERSERIES_COMPAT_meta-tkk-iotcore = "scarthgap"
